[project]
name = "ai-civic-issue-monitoring"
version = "0.1.0"
description = "AI-Based Civic Issue Monitoring System"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "fastapi>=0.95",
    "uvicorn>=0.22",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "tqdm>=4.65",
    "rich>=13.3",
    "hydra-core>=1.3",
    "optuna>=3.1",
    "joblib>=1.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "slowapi>=0.1",
    "python-multipart>=0.0.7",
    "prometheus-fastapi-instrumentator>=6.0.0",
    "opencv-python-headless>=4.8",
    "transformers>=4.30",
]

[project.optional-dependencies]
research = [
    "dvc>=3.0",
    "mlflow>=2.9",
    "evidently>=0.4",
]
dev = [
    "pytest>=7.3",
    "httpx>=0.24",
    "black>=23.3",
    "ruff>=0.1.0",
    "flake8>=6.0",
    "flake8-pyproject",
    "mypy>=1.3",
    "pre-commit>=3.5",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml", "src/app", "src/common"]

[tool.hatch.build.targets.sdist]
packages = ["src/ml", "src/app", "src/common"]



[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
