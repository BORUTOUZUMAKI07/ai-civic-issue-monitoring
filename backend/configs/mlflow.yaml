# MLflow configuration for DagsHub
# Docs: https://dagshub.com/ram.atchutratna/ai-civic-issue-monitoring

tracking_uri: "https://dagshub.com/ram.atchutratna/ai-civic-issue-monitoring.mlflow"
experiment_name: "civicpulse-peft-lora"
model_name: "civic-issue-classifier"

# Training
training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.000968
  unfreeze_last_n: 5
  num_classes: 4
  class_names: ["debris", "garbage", "non_civic", "pothole"]

# PEFT
peft:
  # Research-informed method pool (weighted toward DoRA/LoRA families):
  # dora, dora_plus, lora, lora_plus, rslora, lora_fa, adalora, ia3, oft, boft, loha, lokr
  # VeRA/PiSSA/Delta-LoRA are NOT applicable (Linear-only in peft 0.20, our backbone is conv).
  method: lora
  lora_r: [8, 16]
  lora_alpha: 2r  # alpha = 2 * r recipe, not searched
  lora_dropout: [0.0, 0.05]
  loraplus_ratio: 16.0
  target_modules:
    - features.14.conv.2
    - features.15.conv.2
    - features.16.conv.2

# Optuna
optuna:
  n_trials: 20
  direction: "minimize"
  storage: "sqlite:///optuna.db"

# DVC
dvc:
  data_path: "data/raw"
  model_path: "models/model.pth"
  adapter_path: "models/adapter"
  remote: "origin"
