[newrelic]
; CivicPulse New Relic Python APM agent configuration.
;
; The license key is intentionally NOT hardcoded here. It is injected at
; runtime from the NEW_RELIC_LICENSE_KEY environment variable (see the
; startup wiring in src/core/newrelic.py). When the key is absent the agent
; is never initialized, so the app runs with zero New Relic overhead in
; development, CI, and tests.
license_key = ${NEW_RELIC_LICENSE_KEY}
app_name = CivicPulse-API
log_level = info
monitor_mode = true
high_security = false

; Send request/response bodies to New Relic (disabled by default for privacy).
attributes.enabled = true

; Sampling/transaction settings
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f

; Capture FastAPI endpoint as the transaction name
framework = fastapi
