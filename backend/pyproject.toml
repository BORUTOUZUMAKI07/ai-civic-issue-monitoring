[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "civicpulse-backend"
version = "0.1.0"
description = "CivicPulse - AI-Powered Urban Issue Intelligence Platform"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "beanie>=1.29.0",
    "motor>=3.6.0",
    "redis>=5.2.0",
    "upstash-redis>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.18",
    "email-validator>=2.2.0",
    "httpx>=0.28.0",
    "pillow>=11.0.0",
    "python-json-logger>=2.0.0",
    "pgvector>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.50.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "mongomock>=4.3.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "peft>=0.14.0",
    "optuna>=4.0.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=xml"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests that require external services",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "E712"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
strict = false
check_untyped_defs = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "pgvector.*", "openai.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]
"src/core/config.py" = ["N802"]
"src/errors/**" = ["N818"]
