stages:
  prepare:
    cmd: echo "Data preparation handled by DagsHub pipeline"
    deps:
      - backend/src/ml/training/train.py
    outs:
      - data/balanced_gold:
          persist: true

  train:
    cmd: pixi run --frozen python -c "print('Use backend/src/ml/training/train.py for training')"
    deps:
      - backend/src/ml/training/train.py
      - backend/src/ml/models/build_model.py
      - data/balanced_gold
      - backend/configs/
    outs:
      - models/model.pth
    metrics:
      - metrics/train.json:
          cache: false
