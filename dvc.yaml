stages:
  train:
    cmd: python -m src.ml.training.train
    deps:
      - backend/src/ml/training/train.py
      - backend/src/ml/training/peft_wrapper.py
      - backend/src/ml/models/build_model.py
      - backend/configs/mlflow.yaml
      - data/raw
    outs:
      - models/adapter:
          persist: true
      - models/model.pth
    metrics:
      - metrics/train.json:
          cache: false
