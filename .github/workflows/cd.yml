name: Production Deployment (CD)

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Docker Hub Username
        id: user
        run: |
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$USERNAME" ]; then
            echo "WARNING: DOCKERHUB_USERNAME secret not found. Falling back to sriram365"
            USERNAME="sriram365"
          fi
          echo "docker_username=$USERNAME" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.docker_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.docker_username }}/civic-backend:latest,${{ env.docker_username }}/civic-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.docker_username }}/civic-frontend:latest,${{ env.docker_username }}/civic-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
