name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  # ──────────────── Backend ────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.62.2
          environments: default
          cache: true
      - run: pixi run -e default lint

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicpulse_user
          POSTGRES_PASSWORD: civicpulse_password
          POSTGRES_DB: civicpulse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://civicpulse_user:civicpulse_password@localhost:5432/civicpulse_db
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key-for-ci-only
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.62.2
          environments: default
          cache: true
      - run: pixi run -e default test-ci

  # ──────────────── Frontend ────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ──────────────── Docker (GHCR) ────────────────
  docker-ghcr:
    name: Docker → GHCR
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Lowercase repo
        shell: bash
        run: echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        shell: bash
        run: |
          docker buildx build \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend:latest \
            --push ./backend
      - name: Build and push frontend
        shell: bash
        run: |
          docker buildx build \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend:latest \
            --push ./frontend

  # ──────────────── Docker (DockerHub — tags only) ────────────────
  docker-dockerhub:
    name: Docker → DockerHub
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test, frontend-build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - uses: actions/checkout@v5

      - name: Prepare Docker Username
        id: prep
        run: |
          USER_VAL="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$USER_VAL" ]; then
            echo "Error: DOCKERHUB_USERNAME secret is not set" >&2
            exit 1
          fi
          echo "user=$(echo $USER_VAL | xargs)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.prep.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.user }}/civic-backend:latest
            ${{ steps.prep.outputs.user }}/civic-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.user }}/civic-frontend:latest
            ${{ steps.prep.outputs.user }}/civic-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false
