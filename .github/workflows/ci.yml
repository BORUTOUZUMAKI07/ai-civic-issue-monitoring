name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  # ──────────────── Backend ────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.62.2
          environments: default
          cache: true
      - run: pixi run -e default lint

  # Added alongside lint: mypy was configured but never wired into CI, so
  # type errors could accumulate indefinitely without anything failing. The
  # task is run from `backend/` like lint so mypy picks up
  # `backend/pyproject.toml` (which holds the per-module overrides) rather
  # than the much looser config at the repository root.
  backend-typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.62.2
          environments: default
          cache: true
      - run: pixi run -e default typecheck

  # The five Prefect flows had no CI at all — drift detection, SLA monitoring
  # and the retrain trigger could break on any push without a red check.
  prefect-test:
    name: Prefect Flow Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.62.2
          environments: prefect
          cache: true
      # Deliberately no `working-directory`: prefect-test is declared without
      # a `cwd` and resolves `prefect/tests/` from the workspace root.
      - run: pixi run -e prefect prefect-test

  # `backend/.env` and `prefect/.env` hold live Aiven, MongoDB Atlas and
  # DagsHub credentials. Neither file has ever been tracked and both are
  # gitignored, but nothing previously *failed* a commit that did contain a
  # credential -- a file named `secrets.env` would have slipped past `**/.env`.
  # This is the tripwire: it scans what git actually tracks, so an ignore rule
  # cannot hide a leak, and it is stdlib-only so it runs before any install.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/check_secrets.py

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicpulse_user
          POSTGRES_PASSWORD: civicpulse_password
          POSTGRES_DB: civicpulse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://civicpulse_user:civicpulse_password@localhost:5432/civicpulse_db
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key-for-ci-32-chars-long
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.62.2
          environments: default
          cache: true
      - run: pixi run -e default test-ci

  # SAST + dependency audit, wired together as one job. `security` is bandit
  # over `backend/src`; `security-audit` is pip-audit against the whole active
  # environment with a documented allowlist held in backend/scripts/audit_deps.py
  # (read its module docstring before ever adding an advisory to it).
  backend-security:
    name: Backend Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.62.2
          environments: default
          cache: true
      - run: pixi run -e default security
      - run: pixi run -e default security-audit

  # Real-Postgres integration tests: runs the real `alembic upgrade head`
  # chain against a throwaway postgres:16-alpine container and asserts on the
  # JSONB columns, the issuetype enum and the ON DELETE rules (see
  # backend/tests/test_pg_integration.py). GitHub's ubuntu runners ship Docker;
  # where Docker is unavailable the tests skip themselves instead of failing.
  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.62.2
          environments: default
          cache: true
      - run: pixi run -e default test-integration

  # Performance gate: the existing Locust suite (backend/scripts/loadtest/) run
  # headless against the REAL app with real Postgres + Redis, then asserted on
  # P95 and error-rate budgets by scripts/loadtest/run_gate.py (ADR-0006).
  # This is the regression tripwire that unit tests cannot give: a missing
  # cache, an unbounded query, or synchronous fan-out per request all show up
  # as a P95/error breach here. Images only ship when this is green.
  performance-loadtest:
    name: Performance Load Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicpulse_user
          POSTGRES_PASSWORD: civicpulse_password
          POSTGRES_DB: civicpulse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://civicpulse_user:civicpulse_password@localhost:5432/civicpulse_db
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key-for-ci-32-chars-long
      ENVIRONMENT: development
      # 20 Locust users share one source IP — widen the token buckets so the
      # run measures the app, not the throttle (rate limiting itself is
      # covered by unit tests; consume_rate_limit also fails open).
      RATE_LIMIT_IP_CAPACITY: "100000"
      RATE_LIMIT_IP_REFILL: "1000"
      RATE_LIMIT_USER_CAPACITY: "100000"
      RATE_LIMIT_USER_REFILL: "1000"
      LOCUST_EMAIL: loadtest@example.com
      LOCUST_PASSWORD: LoadTest!2026
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.62.2
          environments: default loadtest
          cache: true

      - name: Start the API
        run: |
          nohup pixi run -e default python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo "uvicorn pid: $!"

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API healthy after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy — uvicorn log:" >&2
          cat /tmp/uvicorn.log >&2
          exit 1

      - name: Seed the load-test account
        run: pixi run -e default python scripts/loadtest/seed_user.py

      - name: Run Locust headless
        run: >
          pixi run -e loadtest loadtest
          --headless -u 20 -r 5 -t 120s
          --host http://127.0.0.1:8000
          --csv loadtest_results
          --html loadtest_report.html

      - name: Assert P95 / error-rate budgets
        run: pixi run -e loadtest python scripts/loadtest/run_gate.py --csv loadtest_results_stats.csv

      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-artifacts
          path: |
            backend/loadtest_results*.csv
            backend/loadtest_report.html
            /tmp/uvicorn.log
          if-no-files-found: ignore

  # ──────────────── Frontend ────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ──────────────── Docker (GHCR) ────────────────
  docker-ghcr:
    name: Docker → GHCR
    runs-on: ubuntu-latest
    needs: [secret-scan, backend-lint, backend-typecheck, backend-test, backend-security, backend-integration, performance-loadtest, frontend-lint, frontend-test, frontend-build, prefect-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Lowercase repo
        shell: bash
        run: echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        shell: bash
        run: |
          docker buildx build \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend:latest \
            --push ./backend
      - name: Build and push frontend
        shell: bash
        run: |
          docker buildx build \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend:latest \
            --push ./frontend

  # ──────────────── Docker (DockerHub — tags only) ────────────────
  docker-dockerhub:
    name: Docker → DockerHub
    runs-on: ubuntu-latest
    # backend-security (and friends) must pass before a tag ships images.
    needs: [secret-scan, backend-lint, backend-typecheck, backend-test, backend-security, backend-integration, performance-loadtest, frontend-lint, frontend-test, frontend-build, prefect-test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - uses: actions/checkout@v5

      - name: Prepare Docker Username
        id: prep
        run: |
          USER_VAL="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$USER_VAL" ]; then
            echo "Error: DOCKERHUB_USERNAME secret is not set" >&2
            exit 1
          fi
          echo "user=$(echo $USER_VAL | xargs)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.prep.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          # Context is `./backend`, not the repository root, and the file is
          # `backend/Dockerfile`. The old `context: .` + `file: docker/Dockerfile`
          # pair pointed at an orphaned Dockerfile whose COPY paths no longer
          # matched anything, so every tagged release failed to build its
          # backend image. This mirrors the GHCR job above, which already
          # builds with the repository root's `./backend` as context.
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.user }}/civic-backend:latest
            ${{ steps.prep.outputs.user }}/civic-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.user }}/civic-frontend:latest
            ${{ steps.prep.outputs.user }}/civic-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false
