name: AI Civic Monitoring Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-qa:
    name: Backend CI (Python)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: "Set up Python"
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run Linting
        run: |
          uv run ruff check . --exit-zero
          uv run mypy src --ignore-missing-imports --no-strict-optional
      - name: Run Tests
        run: uv run pytest tests/ --junitxml=junit.xml

  frontend-qa:
    name: Frontend CI (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run Build
        run: cd frontend && npm run build

  deploy:
    name: Build & Push (Production)
    needs: [backend-qa, frontend-qa]
    # Run on tags OR manual dispatch (if we add it)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - uses: actions/checkout@v4

      - name: Prepare Docker Username
        id: prep
        run: |
          USER_VAL="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$USER_VAL" ]; then
            USER_VAL="sriram365"
          fi
          echo "user=$(echo $USER_VAL | xargs)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.prep.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.user }}/civic-backend:latest
            ${{ steps.prep.outputs.user }}/civic-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.user }}/civic-frontend:latest
            ${{ steps.prep.outputs.user }}/civic-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false
