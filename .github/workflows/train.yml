name: Train PEFT Classifier

on:
  workflow_dispatch:
    inputs:
      n_trials:
        description: "Number of Optuna trials (0 = final training only)"
        required: false
        default: "0"
      final_epochs:
        description: "Epochs for final model training"
        required: false
        default: "15"
  # Auto-start on any push to main. A job-level guard (see 'train' job) only
  # runs the full training for pushes whose subject begins with a Prefect
  # retrain trigger, or for workflow_dispatch, or when training-relevant paths
  # change. This lets the empty commit pushed by Prefect retrain-model kick off
  # training automatically.
  push:
    branches: [main]

env:
  DATA_PATH: data/raw
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
  TRAIN_N_TRIALS: ${{ inputs.n_trials }}
  TRAIN_FINAL_EPOCHS: ${{ inputs.final_epochs }}

jobs:
  train:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'Prefect retrain trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DVC
        run: pip install "dvc[s3]"

      - name: Pull training data
        env:
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
        run: |
          dvc remote modify origin auth basic
          dvc remote modify origin user ${{ secrets.DAGSHUB_USERNAME }}
          dvc remote modify origin password "${{ secrets.DAGSHUB_TOKEN }}"
          dvc pull -r origin --jobs 4

      - name: Install training dependencies
        run: |
          pip install torch torchvision peft optuna mlflow scikit-learn pandas pillow pyyaml

      - name: Run training
        run: |
          cd backend
          python -m src.ml.training.train

      - name: Push model to DVC
        run: |
          dvc add models/model.pth models/adapter || true
          git config user.email "dagshub-action"
          git config user.name "DagsHub Action"
          git add models/model.pth.dvc models/adapter.dvc metrics/
          git diff --cached --quiet || git commit -m "Update model (DagsHub Action)"
          dvc push -r origin

      - name: Upload adapter as artifact
        uses: actions/upload-artifact@v4
        with:
          name: peft-adapter
          path: models/adapter/
          retention-days: 30
