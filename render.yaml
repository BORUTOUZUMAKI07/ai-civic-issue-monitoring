# Render Blueprint for CivicPulse — free-tier deployment.
#
# Create the Blueprint in the Render dashboard, connect the GitHub repo, and
# choose branch `main`. Render prompts for every `sync: false` value at first
# creation. Later Blueprint syncs ignore those values; change them in the
# service's Environment tab instead.
#
# See docs/production-deployment.md for the exact value for each prompt.

services:
  # Free web service. Render free services are limited to one instance and spin
  # down after 15 minutes idle; the first request after idle takes ~1 minute.
  # Redis is Upstash free over TCP (REDIS_URL), not a paid Render Key Value.
  - type: web
    name: civicpulse-api
    runtime: docker
    region: ohio
    plan: free
    # Only GitHub Actions deploy hooks may start a deploy; native Git auto-deploy
    # is disabled on every service in this Blueprint.
    autoDeployTrigger: "off"
    healthCheckPath: /health
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    # Migrations run from the image CMD (see backend/Dockerfile). Render's
    # preDeployCommand is paid-only, and its Docker Command field mis-parses
    # chained shell commands, so the image owns the startup sequence.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL
        value: https://civicpulse-civic-ai8.vercel.app
      - key: CORS_ORIGINS
        value: https://civicpulse-civic-ai8.vercel.app
      - key: STORAGE_BACKEND
        value: s3
      - key: NEON_STORAGE_BUCKET
        value: uploads
      - key: AWS_REGION
        value: us-east-2
      - key: MONGODB_DB
        value: civicpulse_analytics

      # Observability goes to the dedicated collector service below. The app
      # holds only the OTLP endpoint and Basic-auth pair; the New Relic license
      # key lives on the collector. Export stays fail-open.
      - key: NEW_RELIC_ENABLED
        value: "true"
      - key: NEW_RELIC_OTLP_ENDPOINT
        value: https://civicpulse-otel-collector.onrender.com
      - key: NEW_RELIC_EXPORT_INTERVAL_SECONDS
        value: "5"
      - key: NEW_RELIC_APP_NAME
        value: CivicPulse-API
      # These must be the SAME generated pair entered on the collector service.
      # Never commit the values; a mismatch is rejected with HTTP 401.
      - key: OTLP_AUTH_USER
        sync: false
      - key: OTLP_AUTH_PASSWORD
        sync: false

      # Paste these at Blueprint creation; never commit them.
      - key: DATABASE_URL
        sync: false # Neon pooled Postgres URL
      - key: REDIS_URL
        sync: false # Upstash TCP rediss:// URL — leave REST vars UNSET
      - key: MONGODB_URI
        sync: false # MongoDB Atlas SRV URI
      - key: SECRET_KEY
        sync: false # fresh 32+ character JWT signing secret

      # Neon Object Storage. Bucket stays private; app reads through authed proxy.
      - key: AWS_ENDPOINT_URL_S3
        sync: false # Neon Storage endpoint for branch production
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # Dedicated Layer-2 collector (Nexus/LinkForge-style topology): the backend
  # speaks vendor-neutral OTLP; only this service holds the New Relic key.
  # Free tier is deliberate and accepted: after 15 minutes idle the collector
  # sleeps, so the first telemetry after a cold start can be dropped. Export is
  # fail-open, and /health/telemetry remains diagnostic only.
  - type: web
    name: civicpulse-otel-collector
    runtime: docker
    region: ohio
    plan: free
    autoDeployTrigger: "off"
    # Compose builds from ./docker with otel-collector.Dockerfile; Render must
    # use the same context or the relative COPY of otel-collector-config.yaml
    # cannot resolve (Render's build fails with "file not found").
    dockerContext: ./docker
    dockerfilePath: ./otel-collector.Dockerfile
    # No healthCheckPath: Render probes the injected $PORT, which is occupied by
    # the OTLP receiver. The collector's /healthz stays on internal :13133 for
    # local diagnostics (docker-compose publishes it).
    envVars:
      - key: ENVIRONMENT
        value: production
      # Required by ${env:SERVICE_VERSION} in the tracked config; not a secret.
      - key: SERVICE_VERSION
        value: unknown
      # The resource processor stamps service.name from this value; it must
      # match the backend's NEW_RELIC_APP_NAME and the alert filters.
      - key: NEW_RELIC_APP_NAME
        value: CivicPulse-API
      # Never commit these. The vendor key exists ONLY on this service; the
      # backend receives no NEW_RELIC_OTLP_HEADERS at all.
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      # Must match the backend's OTLP_AUTH_* pair exactly, or all signals 401.
      - key: OTLP_AUTH_USER
        sync: false
      - key: OTLP_AUTH_PASSWORD
        sync: false
    # PORT is intentionally NOT set here. Render injects a dynamic PORT for
    # every web service and maps 443 -> that port; the collector config binds
    # OTLP/HTTP to ${env:PORT}. Hard-coding 4318 would make it unreachable.
