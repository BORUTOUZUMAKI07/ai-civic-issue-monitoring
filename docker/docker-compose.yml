services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: civicpulse_backend
    ports:
      - "8000:8000"
    environment:
      # Local-first defaults (ADR-0005): `docker compose --profile dev up`
      # boots the whole stack against the in-compose postgres/redis/mongo
      # services below. Any explicitly-set var always wins, so production
      # deployments (Aiven/Upstash/Atlas) are unaffected — see docker/.env.example.
      # ASYNC_DATABASE_URI is deliberately NOT passed: config.py's
      # build_async_uri derives the asyncpg URL from DATABASE_URL.
      - DATABASE_URL=${DATABASE_URL:-postgresql://civicpulse:changeme@postgres:5432/civicpulse}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - MONGODB_DB=civicpulse_analytics
      # REQUIRED for every deployment path, dev included: there is deliberately
      # no fallback default. Never leaving a guessable SECRET_KEY in the compose
      # file is what stops a trivial-signature JWT oracle if the stack is
      # deployed as-is. Generate one with
      #   python -c 'import secrets; print(secrets.token_urlsafe(64))'
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set (see docker/.env.example)}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - OPENAI_BASE_URL=https://api.groq.com/openai/v1
      # The LLM classifier and embeddings are fail-open (src/core/llm.py,
      # src/core/embeddings.py), so empty keys keep dev boot working while
      # prod sets them via .env / the deployment config.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      # 3-layer New Relic: the app never holds a vendor key — the Layer-2
      # otel-collector service owns NEW_RELIC_LICENSE_KEY. When NEW_RELIC_ENABLED
      # is true the app exports OTLP logs AND traces to the collector, which also
      # scrapes /metrics (Bearer-gated by METRICS_TOKEN).
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-false}
      - NEW_RELIC_OTLP_ENDPOINT=${NEW_RELIC_OTLP_ENDPOINT:-http://otel-collector:4318}
      - NEW_RELIC_EXPORT_INTERVAL_SECONDS=${NEW_RELIC_EXPORT_INTERVAL_SECONDS:-30}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-CivicPulse <no-reply@civicpulse.local>}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - PASSWORD_RESET_TOKEN_EXPIRE_MINUTES=${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-60}
    restart: unless-stopped
    volumes:
      - ../models:/app/models:ro
      - ../backend/uploads:/app/uploads
    depends_on:
      - otel-collector
    networks:
      - frontend-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: civicpulse_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - frontend-net

  # ── Local dev datastores (dev profile only, ADR-0005) ─────────────────────
  # Start the full stack with:  docker compose --profile dev up --build
  # Plain `docker compose up` never starts these — production keeps external
  # Postgres/Redis/Mongo (Aiven/Upstash/Atlas) via the env vars above. The
  # backend self-heals ordering: init_db/init_redis retry with backoff for
  # ~30s at boot.
  postgres:
    image: postgres:16-alpine
    container_name: civicpulse_postgres
    profiles: ["dev"]
    environment:
      POSTGRES_USER: civicpulse
      # Placeholder on purpose: matches the DATABASE_URL dev default above and
      # is local-only — real deployments set DATABASE_URL to their own Aiven/
      # managed Postgres (see docker/.env.example).
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: civicpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpulse -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - frontend-net

  redis:
    image: redis:7-alpine
    container_name: civicpulse_redis
    profiles: ["dev"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data
    networks:
      - frontend-net

  mongo:
    image: mongo:7
    container_name: civicpulse_mongo
    profiles: ["dev"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongodata:/data/db
    networks:
      - frontend-net

  # ── Layer-2: OpenTelemetry Collector (observability transport agent) ──────
  # Receives the backend's OTLP logs+traces on :4318, tail-samples the trace
  # stream, batches, and forwards them to New Relic (Layer-3 sink) using
  # NEW_RELIC_LICENSE_KEY. It also scrapes the backend's /metrics (Bearer-gated
  # when METRICS_TOKEN is set). The app never holds the vendor key. See
  # docker/otel-collector-config.yaml for the full flow. Set before starting
  # (PowerShell):  $env:NEW_RELIC_LICENSE_KEY = "xxxx"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: civicpulse_otel_collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-not-set}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - METRICS_SCRAPE_TARGET=${METRICS_SCRAPE_TARGET:-backend:8000}
    ports:
      - "4317:4317"   # OTLP/gRPC (optional)
      - "4318:4318"   # OTLP/HTTP — what the app pushes logs/traces to
      - "8888:8888"   # collector self-metrics
      - "13133:13133" # /healthz
    restart: unless-stopped
    networks:
      - frontend-net

networks:
  frontend-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  mongodata: