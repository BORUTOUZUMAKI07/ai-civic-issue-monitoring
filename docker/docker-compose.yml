services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: civicpulse_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - ASYNC_DATABASE_URI=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:?UPSTASH_REDIS_REST_URL must be set}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:?UPSTASH_REDIS_REST_TOKEN must be set}
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB=civicpulse_analytics
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - OPENAI_BASE_URL=https://api.groq.com/openai/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      - HF_TOKEN=${HF_TOKEN:?HF_TOKEN must be set}
      # 3-layer New Relic: the app never holds a vendor key — the Layer-2
      # otel-collector service owns NEW_RELIC_LICENSE_KEY. When NEW_RELIC_ENABLED
      # is true the app exports OTLP logs to the collector, which also scrapes
      # /metrics (Bearer-gated by METRICS_TOKEN).
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-false}
      - NEW_RELIC_OTLP_ENDPOINT=${NEW_RELIC_OTLP_ENDPOINT:-http://otel-collector:4318}
      - NEW_RELIC_EXPORT_INTERVAL_SECONDS=${NEW_RELIC_EXPORT_INTERVAL_SECONDS:-30}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-CivicPulse <no-reply@civicpulse.local>}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - PASSWORD_RESET_TOKEN_EXPIRE_MINUTES=${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-60}
    restart: unless-stopped
    volumes:
      - ../models:/app/models:ro
      - ../backend/uploads:/app/uploads
    depends_on:
      - otel-collector
    networks:
      - frontend-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: civicpulse_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - frontend-net

  # ── Layer-2: OpenTelemetry Collector (observability transport agent) ──────
  # Receives the backend's OTLP logs on :4318, batches, and forwards them to
  # New Relic (Layer-3 sink) using NEW_RELIC_LICENSE_KEY. It also scrapes the
  # backend's /metrics (Bearer-gated when METRICS_TOKEN is set). The app never
  # holds the vendor key. See docker/otel-collector-config.yaml for the full
  # flow. Set before starting (PowerShell):  $env:NEW_RELIC_LICENSE_KEY = "xxxx"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: civicpulse_otel_collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-not-set}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - METRICS_SCRAPE_TARGET=${METRICS_SCRAPE_TARGET:-backend:8000}
    ports:
      - "4317:4317"   # OTLP/gRPC (optional)
      - "4318:4318"   # OTLP/HTTP — what the app pushes logs to
      - "8888:8888"   # collector self-metrics
      - "13133:13133" # /healthz
    restart: unless-stopped
    networks:
      - frontend-net

networks:
  frontend-net:
    driver: bridge
