# CivicPulse — Layer-2 OpenTelemetry Collector (collection & transport).
#
# Data flow (3-layer observability):
#   Layer 1 (in-process)   the backend app ONLY speaks OTLP: structured logs
#                          (src/log_utils), spans (FastAPI/httpx/SQLAlchemy
#                          instrumentors) and RED metrics (OTelMetricsMiddleware).
#                          Gated by NEW_RELIC_ENABLED + NEW_RELIC_OTLP_ENDPOINT.
#                          There is no /metrics scrape path and the app holds no
#                          vendor key.
#   Layer 2 (this agent)   receives OTLP on :4318, tail-samples traces,
#                          batches, and forwards all three signals to Layer 3.
#                          Its exporters are the ONLY vendor-aware part of the
#                          stack: swapping or adding a sink is a change here.
#   Layer 3 (sink)         New Relic (otlphttp exporter) — and optionally Grafana
#                          Cloud, fanned out below.
#
# Local:      docker compose -f docker/docker-compose.yml up otel-collector
#
# Required env (compose supplies defaults):
#   NEW_RELIC_LICENSE_KEY   New Relic ingest key (agent-only secret).
#   ENVIRONMENT             production / development (resource attribute).
#   OTLP_AUTH_USER          HTTP basic-auth user guarding BOTH OTLP protocols.
#   OTLP_AUTH_PASSWORD      the matching password. These are placeholders by
#                           default (civicpulse/civicpulse) and MUST be changed
#                           in production — on a public host an unauthenticated
#                           receiver would burn the ingest quota for free.
#
# Optional env:
#   SERVICE_VERSION         app version stamped on every signal (default: unknown).
#   GRAFANA_OTLP_ENDPOINT   e.g. https://otlp-gateway-prod-<region>.grafana.net/otlp
#   GRAFANA_OTLP_TOKEN      "Basic <base64(instance_id:api_token)>" for the above.
#                           Both are consumed by the OPTIONAL overlay
#                           otel-collector-config.grafana.yaml, which mirrors every
#                           signal into Grafana Cloud alongside New Relic — zero
#                           application change (see that file's header).
# SECURITY: on a public host both ports below are reachable by anyone, and an
# open receiver lets a stranger POST junk that burns the ingest quota. Both
# protocols therefore REQUIRE HTTP basic auth (extensions.basicauth/server),
# fed by OTLP_AUTH_USER / OTLP_AUTH_PASSWORD. The app sends the matching
# `Authorization: Basic` header (config.py OTLP_AUTH_*); a wrong pair is a 401
# the collector logs, not a partial ingest you would never notice. Prefer
# binding the collector to a private network as well — auth is not a substitute
# for network placement.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: basicauth/server
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: basicauth/server

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  # Tail-sampling: keep every error span, ~10% of the rest. The app sends its
  # full trace stream, so the agent decides what reaches the free tier.
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    expected_new_traces_per_sec: 50
    policies:
      - name: keep-all-errors
        type: status_code
        status_code: {status_codes: [ERROR, UNSET]}
      - name: sample-rest
        type: probabilistic
        probabilistic: {sampling_percentage: 10}
  batch:
    send_batch_size: 512
    timeout: 5s
  # `action` is REQUIRED on every entry in collector-contrib v0.121: leaving it
  # out yields an empty action, and the processor refuses to build:
  #     failed to build pipelines: failed to create "resource" processor, in
  #     pipeline "logs": error creating AttrProc due to unsupported action ""
  # which kills the collector at startup (exit 1) before /healthz ever answers.
  # `upsert` is the intended semantics: set the attribute, or overwrite it if a
  # sender already set one.
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:ENVIRONMENT}
        action: upsert
      - key: service.name
        value: civicpulse-backend
        action: upsert
      - key: service.version
        value: ${env:SERVICE_VERSION}
        action: upsert

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Persistent on-disk queue so a New Relic outage or restart does not drop
  # telemetry after the in-memory retry window expires. Bound by `sending_queue`
  # below; the directory lives on the compose volume (docker-compose.yml).
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: true
  # HTTP basic auth on the OTLP receiver (both protocols). `inline` is a
  # `user:password` htpasswd entry; the values come from the environment so the
  # collector and the app read the SAME pair (compose env OTLP_AUTH_*, mirrored
  # onto the backend's config.py OTLP_AUTH_*). The default is a placeholder that
  # MUST be changed in production — never inline a real credential here, it
  # would land in version control.
  basicauth/server:
    htpasswd:
      inline: "${env:OTLP_AUTH_USER}:${env:OTLP_AUTH_PASSWORD}"

exporters:
  otlphttp/newrelic:
    endpoint: https://otlp.nr-data.net:4318
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}
    compression: gzip
    # Buffer to disk, then retry with backoff: telemetry survives a sink outage
    # (up to max_elapsed_time) and a collector restart (via file_storage).
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 20
  # ─── Second sink (no vendor lock-in): Grafana Cloud is an OPT-IN overlay ───
  # The exporter and the pipelines that use it live in
  # otel-collector-config.grafana.yaml, loaded as a SECOND config file (the
  # collector merges them: exporters union, pipelines from the overlay win):
  #   --config=/etc/otelcol-contrib/config.yaml
  #   --config=/etc/otelcol-contrib/config.grafana.yaml
  # It is kept out of this file on purpose: the collector refuses to START when
  # an otlphttp exporter has an empty endpoint, and the Grafana credentials are
  # optional. Enabling it is therefore a config/flag change, never an app change
  # — Layer 2 is the only vendor-aware component in the stack.

service:
  extensions: [health_check, file_storage, basicauth/server]
  pipelines:
    # All three signals arrive on the same OTLP receiver — one transport, one
    # place to add/remove a sink, and no scrape path to keep in sync.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/newrelic, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/newrelic, debug]
    # Traces are tail-sampled here (keep errors, ~10% of the rest) before the
    # free tier sees them.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch, resource]
      exporters: [otlphttp/newrelic, debug]
