[workspace]
name = "civicpulse"
description = "AI-Powered Civic Issue Monitoring System for Vadodara"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
pip = ">=26.2.0"
dvc = ">=3.67.1,<4"
pillow-heif = ">=1.5.0,<2"

[pypi-dependencies]
fastapi = ">=0.115.0"
uvicorn = ">=0.32.0"
pydantic = ">=2.10.0"
pydantic-settings = ">=2.7.0"
# `sqlalchemy[asyncio]` (not bare sqlalchemy): from 2.1 onward greenlet is
# only pulled in by that extra, and `from sqlalchemy.ext.asyncio import
# AsyncSession` raises ModuleNotFoundError without it.
sqlalchemy = {version = ">=2.0.36", extras = ["asyncio"]}
asyncpg = ">=0.30.0"
alembic = ">=1.14.0"
beanie = ">=1.29.0"
# 3.6.x caps pymongo<4.10, which is below every fixed release for the 2026
# pymongo CVEs (CVE-2026-88029 + CVE-2026-96747/48/49) — so motor must move up
# too, and pymongo gets an explicit floor at 4.18.2 (first fixed).
motor = ">=3.7.0"
pymongo = ">=4.18.2,<5"
redis = ">=5.2.0"
upstash-redis = ">=1.0.0"
python-jose = {version = ">=3.3.0", extras = ["cryptography"]}
passlib = {version = ">=1.7.4", extras = ["argon2"]}
argon2-cffi = ">=23.1.0"
python-multipart = ">=0.0.18"
email-validator = ">=2.2.0"
httpx = ">=0.28.0"
pillow = ">=11.0.0"
# structlog renders structured JSON with request-scoped context (see
# src/log_utils); stdlib logging still does the transport.
structlog = ">=24.1.0"
pgvector = ">=0.3.0"
langgraph = ">=0.2.0"
langchain-core = ">=0.3.0"
openai = ">=1.50.0"
numpy = ">=1.26.0"
pyotp = ">=2.9.0"
civicpulse-backend = {path = "./backend", editable = true}

[pypi-dependencies.pytest]
version = ">=8.0.0"

[pypi-dependencies.pytest-asyncio]
version = ">=0.24.0"

[pypi-dependencies.pytest-cov]
version = ">=6.0.0"

[pypi-dependencies.pytest-timeout]
version = ">=2.3.0"

[pypi-dependencies.mongomock]
version = ">=4.3.0"

[pypi-dependencies.aiosqlite]
version = ">=0.20.0"

[pypi-dependencies.fakeredis]
version = ">=2.23.0"

[pypi-dependencies.mongomock-motor]
version = ">=0.0.29"

# --- Security scanning (pixi run -e default security / security-deps) ---
[pypi-dependencies.bandit]
version = ">=1.8.0"

[pypi-dependencies.pip-audit]
version = ">=2.7.3"

# --- Real-Postgres integration tests (pixi run -e default test-integration) ---
[pypi-dependencies.testcontainers]
version = ">=4.8.0"
extras = ["postgres"]

# --- Outbound resilience: retries with exponential backoff for the OpenAI
#     classifier and SMTP mailer (see src/core/llm.py, src/core/email.py). ---
[pypi-dependencies.tenacity]
version = ">=9.0.0"

# --- Property-based tests (backend/tests/test_hypothesis.py) ---
[pypi-dependencies.hypothesis]
version = ">=6.100.0"

[feature.dev.dependencies]
ruff = ">=0.8.0"
mypy = ">=1.13.0"
pre-commit = ">=4.0.0"

[feature.ml.dependencies]
scikit-learn = ">=1.5.0"

[feature.ml.pypi-dependencies]
torch = ">=2.0.0"
torchvision = ">=0.15.0"
peft = ">=0.14.0"
optuna = ">=4.0.0"
pyyaml = ">=6.0"
mlflow = ">=2.20.0"
civicpulse-backend = {path = "./backend", editable = true, extras = ["ml"]}
dvc-s3 = ">=3.3.0, <4"

# Load testing with Locust against a real deployment
# (backend/scripts/loadtest/locustfile.py). Deliberately NOT in the default
# env: locust pulls gevent/msgpack/pyzmq, which would bloat the CI solve and
# widen the pip-audit surface for zero runtime benefit.
[feature.loadtest.pypi-dependencies]
locust = ">=2.31.0"

# Prefect ORCHESTRATION for the 5 data/MLEngineering flows.
# Flows run in Prefect Cloud (managed) at runtime; this env is used locally to
# register/deploy flows, run the drift-logic tests, and validate entrypoints.
[feature.prefect.dependencies]
git = "*"

[feature.prefect.pypi-dependencies]
prefect = ">=3.0,<4"
pymongo = ">=4.6,<5"
psycopg2-binary = ">=2.9"
requests = ">=2.31"
pytest = ">=8.0.0"

[tasks]
dev = { cmd = "uvicorn src.main:app --reload --host 0.0.0.0 --port 8000", cwd = "backend" }
start = { cmd = "python -m uvicorn src.main:app --host 0.0.0.0 --port 8000", cwd = "backend" }
test = { cmd = "python -m pytest tests/ -v --timeout=60", cwd = "backend" }
test-ci = { cmd = "python -m pytest tests/ -v --timeout=60 -m 'not integration'", cwd = "backend" }
lint = { cmd = "ruff check src/ && ruff format --check src/", cwd = "backend" }
lint-fix = { cmd = "ruff check src/ --fix && ruff format src/", cwd = "backend" }
typecheck = { cmd = "mypy src/", cwd = "backend" }
# SAST + dependency audit. Mirrors the `backend-security` CI job.
security = { cmd = "bandit -r src/ -c pyproject.toml", cwd = "backend" }
# `audit_deps.py` holds the documented `--ignore-vuln` allowlist (see the
# module docstring for why each entry is acceptable and how it shrinks).
security-audit = { cmd = "python scripts/audit_deps.py", cwd = "backend" }
# Real-Postgres integration tests. These need Docker; without it the tests
# skip themselves rather than fail (see tests/test_pg_integration.py).
# `test-ci` deliberately excludes them with `-m 'not integration'`.
test-integration = { cmd = "python -m pytest tests/ -v --timeout=600 -m integration", cwd = "backend" }
format = { cmd = "ruff format src/", cwd = "backend" }
migrate = { cmd = "python -m alembic upgrade head", cwd = "backend" }
migrate-create = { cmd = "python -m alembic revision --autogenerate", cwd = "backend" }
seed = { cmd = "python scripts/seed_wards.py", cwd = "backend" }
# Bootstrap the first admin (the public API cannot create one). Env-driven:
#   ADMIN_EMAIL=... ADMIN_PASSWORD=... [ADMIN_ROLE=super_admin] pixi run create-admin
create-admin = { cmd = "python scripts/create_admin.py", cwd = "backend" }
train = { cmd = "python -u backend/src/ml/training/train.py", env = { PYTHONPATH = "backend", PYTHONIOENCODING = "utf-8" } }
dvc-pull = { cmd = "dvc pull -r origin --jobs 4" }
dvc-status = { cmd = "dvc status" }
frontend = { cmd = "npm run dev", cwd = "frontend" }
frontend-build = { cmd = "npm run build", cwd = "frontend" }
frontend-test = { cmd = "npm run test", cwd = "frontend" }
all = { cmd = "echo 'Run pixi run dev in one terminal and pixi run frontend in another'", depends-on = [] }
clean = { cmd = "python -c \"import shutil; [shutil.rmtree(d, True) for d in ['__pycache__', 'backend/__pycache__', '.pytest_cache', 'backend/.pytest_cache']]; print('Cleaned')\"" }
setup = { cmd = "pre-commit install && echo 'Pre-commit hooks installed'" }
# Prefect flows (run with: pixi run -e prefect <task>)
prefect-login = { cmd = "python -m prefect cloud login" }
prefect-check-connections = { cmd = "python prefect/check_connections.py" }
prefect-deploy = { cmd = "python prefect/deploy.py" }
prefect-test = { cmd = "python -m pytest prefect/tests/ -v" }
prefect-register = { cmd = "python -m prefect flow register" }
# ML evaluation harness (classifier P/R/F1, retrieval MRR/NDCG). See
# backend/scripts/evaluate_ml.py --help. Offline + deterministic by default.
evaluate-ml = { cmd = "python scripts/evaluate_ml.py", cwd = "backend" }
# Load-test smoke suite. Needs the loadtest env (locust):
#   pixi run -e loadtest -- loadtest --host https://api.example.com
# or plain: pixi run -e loadtest -- locust -f backend/scripts/loadtest/locustfile.py --host ...
loadtest = { cmd = "locust -f scripts/loadtest/locustfile.py", cwd = "backend" }

[environments]
default = { features = ["dev", "ml"], solve-group = "default" }
ml = { features = ["ml"], solve-group = "default" }
ci = { features = ["dev"], solve-group = "default" }
prefect = { features = ["prefect"], solve-group = "default" }
loadtest = { features = ["loadtest"], solve-group = "default" }
